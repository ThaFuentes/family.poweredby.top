<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Family OS</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/fav.jpg') }}" type="image/jpeg">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/family.css') }}">
</head>
<body class="auth">
  <div class="auth-page">
    <div class="wrap">
      <div style="text-align:center;margin-bottom:1rem">
        <img src="{{ url_for('static', filename='images/fav.jpg') }}" alt="" style="width:72px;height:72px;border-radius:18px">
        <h1>Start a household</h1>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <div class="card">
        <form method="post">
          <label>Your name</label>
          <input name="name" required>
          <label>Username</label>
          <input name="username" autocomplete="username" required>
          <label>Email (optional)</label>
          <input type="email" name="email" autocomplete="email">
          <label>Password</label>
          <input type="password" name="password" autocomplete="new-password" required>
          <hr style="border:0;border-top:1px solid var(--edge);margin:1rem 0">
          <label>New household name</label>
          <input name="household_name" placeholder="The Fuentes house">
          <p class="muted" style="margin:.4rem 0">or join an existing household:</p>
          <label>Invite code</label>
          <input name="invite_code" value="{{ invite or '' }}" placeholder="ABC123">
          <div class="btn-row">
            <button class="btn block" type="submit">Create account</button>
          </div>
        </form>
      </div>
      <p class="muted" style="text-align:center"><a href="{{ url_for('auth.login') }}">Already have an account</a></p>
    </div>
  </div>
</body>
</html>
