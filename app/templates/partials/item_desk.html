{% if item.item_type in ('vehicle', 'tool', 'house') or item.vehicle or item.tool %}
<div class="home-strip item-desk-row">
  {% if item.item_type in ('vehicle', 'tool', 'house') %}
  <button type="button" class="home-chip" data-sheet="{{ url_for('items.notes_sheet', item_id=item.id) }}" data-sheet-title="Notes">
    <span class="kicker">Notes</span>
    <strong>{% if item_notes %}{{ item_notes|length }}{% else %}None yet{% endif %}</strong>
  </button>
  {% endif %}
  {% if item.vehicle or item.tool %}
  {% set oil = item.vehicle or item.tool %}
  <button type="button" class="home-chip" data-sheet="{{ url_for('items.oil_sheet', item_id=item.id) }}" data-sheet-title="Oil">
    <span class="kicker">Oil</span>
    <strong>{{ oil.oil_needs or oil.oil_type or 'Not set' }}</strong>
  </button>
  {% endif %}
</div>
{% endif %}
