<aside class="side-nav no-print" aria-label="Site">
  <a class="side-brand" href="{{ url_for('home.home') }}">
    <img src="{{ url_for('static', filename='images/fav.jpg') }}" alt="">
    <span>
      <strong>Family OS</strong>
      <small>{{ household_name or 'your household' }}</small>
    </span>
  </a>
  <nav class="side-links">
    <a href="{{ url_for('home.home') }}" class="{% if request.endpoint == 'home.home' %}active{% endif %}">Home</a>
    <a href="{{ url_for('find.index') }}" class="{% if request.endpoint == 'find.index' %}active{% endif %}">Find</a>
    <button type="button" class="side-scan" data-open-scan>Scan</button>
    <a href="{{ url_for('groceries.index') }}" class="{% if request.endpoint == 'groceries.index' %}active{% endif %}">Inventory</a>
    <a href="{{ url_for('groceries.grocery_list') }}" class="{% if request.endpoint == 'groceries.grocery_list' %}active{% endif %}">Basket</a>
    <a href="{{ url_for('tools.index') }}" class="{% if request.endpoint and 'tool' in request.endpoint %}active{% endif %}">Tools</a>
    <a href="{{ url_for('vehicles.index') }}" class="{% if request.endpoint and 'vehicle' in request.endpoint %}active{% endif %}">Vehicles</a>
    <a href="{{ url_for('house.index') }}" class="{% if request.endpoint and 'house' in request.endpoint %}active{% endif %}">House</a>
    <a href="{{ url_for('notes.index') }}" class="{% if request.endpoint and 'note' in request.endpoint %}active{% endif %}">Notes</a>
    {% if current_user.role != 'child' %}
    <a href="{{ url_for('vault.index') }}" class="{% if request.endpoint and request.endpoint.startswith('vault.') %}active{% endif %}">Vault</a>
    <a href="{{ url_for('sort.index') }}" class="{% if request.endpoint and request.endpoint.startswith('sort.') %}active{% endif %}">Sort</a>
    <a href="{{ url_for('legal.index') }}" class="{% if request.endpoint and request.endpoint.startswith('legal.') %}active{% endif %}">Records</a>
    <a href="{{ url_for('members.index') }}" class="{% if request.endpoint == 'members.index' %}active{% endif %}">Household</a>
    {% if can('override') %}
    <a href="{{ url_for('members.happened') }}" class="{% if request.endpoint and 'happened' in request.endpoint %}active{% endif %}">Happened</a>
    {% endif %}
    {% endif %}
    <a href="{{ url_for('reminders.index') }}" class="{% if request.endpoint and 'reminder' in request.endpoint %}active{% endif %}">Due</a>
    <a href="{{ url_for('appearance.picker') }}" class="{% if request.endpoint and 'appearance' in request.endpoint %}active{% endif %}">Look</a>
  </nav>
  <p class="side-foot muted">Same house on a phone or a computer.</p>
</aside>
