<div class="ask-root" id="ask-root">
  <button type="button" class="ask-fab" id="ask-open" aria-expanded="false" aria-controls="ask-panel">
    Ask
  </button>
  <section class="ask-panel" id="ask-panel" hidden>
    <header class="ask-head">
      <div class="ask-bar">
        <strong>Ask</strong>
        <div class="ask-actions">
          <button type="button" class="btn sm secondary" id="ask-clear">New</button>
          <button type="button" class="btn sm secondary" id="ask-close">Close</button>
        </div>
      </div>
      <p class="ask-hint">Photo a tool, part, barcode, or ticket. Or ask to add someone, a bill, a note.</p>
    </header>
    <div class="ask-log" id="ask-log" aria-live="polite"></div>
    <form class="ask-form" id="ask-form" autocomplete="off">
      <div class="ask-preview" id="ask-preview" hidden>
        <img id="ask-preview-img" alt="">
        <span id="ask-preview-name"></span>
        <button type="button" class="btn sm secondary" id="ask-preview-clear">Remove</button>
      </div>
      <label class="ask-cam" for="ask-file">Photo</label>
      <input class="sr-only" id="ask-file" type="file" accept="image/*">
      <label class="sr-only" for="ask-input">Ask</label>
      <textarea id="ask-input" maxlength="2000" rows="2" placeholder="Photo a drill, a part, or a barcode. Or add Sam as a member…"></textarea>
      <button class="btn" type="submit" id="ask-send">Send</button>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='js/ask.js') }}?v=os6" defer></script>
