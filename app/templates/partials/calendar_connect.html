<section class="card cal-connect" id="calendar">
  <h2>Your calendar</h2>
  {% if cal_links.cal_ready %}
  <p class="cal-target">{{ cal_links.cal_provider_label }} · <span class="cal-email">{{ cal_links.cal_email }}</span></p>
  {% else %}
  <p class="muted">Which inbox should get due dates?</p>
  {% endif %}

  <form method="post" action="{{ url_for('appearance.set_calendar') }}">
    {% if cal_next %}<input type="hidden" name="next" value="{{ cal_next }}">{% endif %}
    <div class="cal-row">
      <label class="sr-only" for="calendar-email">Which email calendar</label>
      <input id="calendar-email" name="calendar_email" type="email" value="{{ cal_links.cal_email }}" placeholder="you@gmail.com" autocomplete="email">
      <label class="sr-only" for="calendar-provider">That inbox's calendar</label>
      <select id="calendar-provider" name="calendar_provider">
        <option value="google" {% if cal_links.cal_provider=='google' %}selected{% endif %}>Google</option>
        <option value="apple" {% if cal_links.cal_provider=='apple' %}selected{% endif %}>Apple</option>
        <option value="outlook" {% if cal_links.cal_provider=='outlook' %}selected{% endif %}>Outlook</option>
        <option value="other" {% if cal_links.cal_provider=='other' %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="cal-toggle" role="radiogroup" aria-label="How dates get there">
      <label class="cal-chip">
        <input type="radio" name="calendar_mode" value="auto" {% if cal_links.cal_auto %}checked{% endif %}>
        <span>Auto-add</span>
      </label>
      <label class="cal-chip">
        <input type="radio" name="calendar_mode" value="manual" {% if not cal_links.cal_auto %}checked{% endif %}>
        <span>I'll add them</span>
      </label>
    </div>

    <label class="cal-check">
      <input type="checkbox" name="email_due" value="1" {% if current_user.notify_via in ('email', 'both') %}checked{% endif %}>
      <span>Email me when due</span>
    </label>
    <div class="btn-row"><button class="btn" type="submit">Save</button></div>
  </form>

  {% if not cal_links.cal_auto %}
  <details class="cal-manual">
    <summary>Subscribe on a phone</summary>
    <div class="cal-apps">
      <a class="btn sm" href="{{ cal_links.apple }}">Apple</a>
      <a class="btn sm secondary" href="{{ cal_links.google }}" target="_blank" rel="noopener">Google</a>
      <a class="btn sm secondary" href="{{ cal_links.outlook }}" target="_blank" rel="noopener">Outlook</a>
    </div>
    <div class="key-copy-row">
      <input readonly value="{{ cal_url }}" onclick="this.select()" aria-label="Calendar feed">
      <button type="button" class="btn sm" data-copy="{{ cal_url }}">Copy</button>
    </div>
  </details>
  {% endif %}
</section>
