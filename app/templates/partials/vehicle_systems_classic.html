<p class="muted" style="margin:0 0 .85rem">{% if systems_host == 'house' %}Tap a system to see what's on it.{% else %}Tap a system to see what's on it.{% endif %} Add is a button after that.</p>
{% include "partials/item_desk.html" %}

<div class="grid sys-menu">
  {% for s in systems %}
  <button type="button" class="tile" data-sheet="{{ url_for('items.parts_sheet', item_id=item.id, system=s.id) }}" data-sheet-title="{{ s.label }}">
    <span class="kicker">{% if s.count %}{{ s.count }} on it{% else %}Empty{% endif %}</span>
    <span class="label">{{ s.label }}</span>
    <span class="count">{{ s.hint }}</span>
  </button>
  {% endfor %}
</div>
{% if can_maintain or can_edit %}
<button type="button" class="btn home-cal-btn" data-sheet="{{ url_for('items.parts_sheet', item_id=item.id) }}" data-sheet-title="Add a part">Add a part</button>
{% endif %}
