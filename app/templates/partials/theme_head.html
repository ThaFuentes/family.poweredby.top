<meta name="theme-color" content="{{ theme_color }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/family.css') }}?v=os73">
<link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}?v=os25">
<script>
(function () {
  try {
    var m = document.cookie.match(/(?:^|; )family_theme=([^;]*)/);
    var t = m ? decodeURIComponent(m[1]) : {{ current_theme|tojson }};
    if (!/^(default|clean|dark|when99|mimix)$/.test(t)) t = "default";
    document.documentElement.setAttribute("data-theme", t);
    var colors = { default: "#1f6a45", clean: "#111111", dark: "#0c0d0e", when99: "#008080", mimix: "#5c6b7a" };
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", colors[t] || colors.default);
  } catch (e) {}
})();
(function () {
  try {
    var standNow = window.matchMedia("(display-mode: standalone)").matches
      || window.matchMedia("(display-mode: window-controls-overlay)").matches
      || window.matchMedia("(display-mode: minimal-ui)").matches
      || window.navigator.standalone === true;
    if (standNow) document.documentElement.classList.add("family-standalone");
    if (window.self !== window.top) return;
    if ((location.pathname || "").indexOf("/platform") === 0) return;
    if (sessionStorage.getItem("family.intro.v4") === "1") return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!standNow) return;
    document.documentElement.classList.add("family-intro-on");
    var s = document.createElement("script");
    s.src = "/static/js/intro.js?v=os4";
    s.defer = true;
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/images/pwa-192.png">
<script src="/static/js/pwa-install.js?v=family-os2" defer></script>
