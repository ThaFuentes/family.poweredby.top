<meta name="theme-color" content="{{ theme_color }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/family.css') }}?v=os11">
<link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}?v=os11">
<script>
(function () {
  try {
    var m = document.cookie.match(/(?:^|; )family_theme=([^;]*)/);
    var t = m ? decodeURIComponent(m[1]) : {{ current_theme|tojson }};
    if (!/^(default|clean|dark|when99)$/.test(t)) t = "default";
    document.documentElement.setAttribute("data-theme", t);
    var colors = { default: "#1f6a45", clean: "#111111", dark: "#0c0d0e", when99: "#008080" };
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", colors[t] || colors.default);
  } catch (e) {}
})();
</script>
