<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6a45">
  <title>Family OS — offline</title>
  <style>
    html, body { margin: 0; min-height: 100dvh; background: #f3f1ec; color: #141816;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: .85rem; padding: 2rem 1.4rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 28px rgba(31,106,69,.22); }
    strong { font-size: 1.2rem; letter-spacing: -.03em; }
    p { margin: 0; max-width: 22rem; color: #66716a; font-weight: 600; line-height: 1.45; }
    a { color: #1f6a45; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/static/images/fav.jpg" alt="">
    <strong>Family OS</strong>
    <p>You're offline. This app does not keep household lists on the device. Open it again when you have a signal.</p>
    <p><a href="/">Try again</a></p>
  </main>
</body>
</html>
